[workspace]
resolver = "3"
members = [
    "crates/cublas-rs",
    "crates/cublas-core",
    "crates/cublas-sgemm",
    "crates/cublas-dgemm",
    "crates/cublas-hgemm",
    "crates/cublas-batched-gemm",
    "crates/cublas-vector",
    "crates/cublas-bench-core",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["zTgx"]
license = "Apache-2.0"
repository = "https://github.com/zTgx/cublas-rs"

[workspace.dependencies]
cublas-rs = { version = "0.1.0", path = "crates/cublas-rs" }
cublas-core = { version = "0.1.0", path = "crates/cublas-core" }
cublas-sgemm = { version = "0.1.0", path = "crates/cublas-sgemm" }
cublas-dgemm = { version = "0.1.0", path = "crates/cublas-dgemm" }
cublas-hgemm = { version = "0.1.0", path = "crates/cublas-hgemm" }
cublas-batched-gemm = { version = "0.1.0", path = "crates/cublas-batched-gemm" }
cublas-vector = { version = "0.1.0", path = "crates/cublas-vector" }
cublas-bench-core = { version = "0.1.0", path = "crates/cublas-bench-core" }
cuda-oxide = { git = "https://github.com/NVlabs/cuda-oxide", branch = "main" }
half = "2.7"
