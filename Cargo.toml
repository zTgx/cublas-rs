[workspace]
resolver = "3"
members = [
    "crates/cublas-rs",
    "crates/cublas-core",
    "crates/cublas-l1",
    "crates/cublas-l2",
    "crates/cublas-l3",
    "crates/cublas-bench-core",
    "benches",
]
# `cargo run --example ...` / `cargo build` (no -p) target cublas-rs by default.
default-members = ["crates/cublas-rs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["zTgx"]
license = "Apache-2.0"
repository = "https://github.com/zTgx/cublas-rs"

[workspace.dependencies]
# Internal crates
cublas-rs = { version = "0.1.0", path = "crates/cublas-rs" }
cublas-core = { version = "0.1.0", path = "crates/cublas-core" }
cublas-l1 = { version = "0.1.0", path = "crates/cublas-l1" }
cublas-l2 = { version = "0.1.0", path = "crates/cublas-l2" }
cublas-l3 = { version = "0.1.0", path = "crates/cublas-l3" }
cublas-bench-core = { version = "0.1.0", path = "crates/cublas-bench-core" }

# cuda-oxide local checkout (../cuda-oxide). Switch to git deps when releasing.
cuda-core = { path = "../cuda-oxide/crates/cuda-core" }
cuda-device = { path = "../cuda-oxide/crates/cuda-device" }
cuda-host = { path = "../cuda-oxide/crates/cuda-host" }

# Third-party
half = "2.7"
