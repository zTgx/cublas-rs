[package]
name = "cublas-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "A BLAS implementation built on cuda-oxide"
license.workspace = true
repository.workspace = true
# cargo-oxide standalone mode only forwards `--bin <name>` to cargo (not
# `--example`), so smoke tests are declared as bins. `default-run = "hello"`
# makes a bare `cargo oxide run` exercise the most basic toolchain path
# (no BLAS dep, no shared memory) — works on any CUDA card sm_20+.
default-run = "hello"
# Example sources live at the repo root in `/examples/`, declared explicitly as
# `[[bin]]` below. No `examples/` dir inside this crate, so auto-discovery is
# already a no-op — `autoexamples = false` is kept for clarity.
autoexamples = false

[dependencies]
cublas-core.workspace = true
cublas-l1.workspace = true
cublas-l2.workspace = true
cublas-l3.workspace = true
# `hello.rs` uses cuda-oxide directly (not via cublas-l*), so add the host +
# device runtime crates explicitly.
cuda-core.workspace = true
cuda-device.workspace = true
cuda-host.workspace = true

[[bin]]
name = "hello"
path = "../../examples/hello.rs"

[[bin]]
name = "saxpy"
path = "../../examples/saxpy.rs"

[[bin]]
name = "sgemm_basic"
path = "../../examples/sgemm_basic.rs"
